name: Sincronização Diária com Zoho

on:
  schedule:
    # Executa todos os dias às 02:00 AM UTC (23:00 horário de Brasília no horário de verão)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Permite execução manual via interface do GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Instalar Railway CLI
        run: |
          npm i -g @railway/cli
      
      - name: Executar Sincronização via Railway CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Executando sincronização completa no Railway..."
          railway run python sync_complete.py --phases-only
          echo "Sincronização concluída!"
