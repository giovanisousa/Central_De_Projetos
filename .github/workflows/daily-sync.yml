name: Sincronização Diária com Zoho

on:
  schedule:
    # Executa todos os dias às 02:00 AM UTC (23:00 horário de Brasília no horário de verão)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Permite execução manual via interface do GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Executar Sincronização via HTTP
        run: |
          echo "Executando sincronização completa..."
          response=$(curl -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            https://centraldeprojetos-production.up.railway.app/api/trigger-sync)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Sincronização concluída com sucesso!"
            exit 0
          else
            echo "❌ Erro na sincronização"
            exit 1
          fi
