<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Projetos Kanban</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="kanban-page">
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard de Projetos Kanban</h1>
            
            <div class="controls">
                <div class="control-group">
                    <label for="gpSelect">Selecionar GP:</label>
                    <select id="gpSelect">
                        <option value="">Escolha um GP...</option>
                        {% for gp in gps %}
                        <option value="{{ gp }}">{{ gp }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <button id="loadButton" onclick="carregarProjetos()">
                    Carregar Projetos
                </button>

                <button type="button" id="openProjectModal">
                    Adicionar Novo Projeto
                </button>

                {% if logged_in %}
                    <span class="user">{{ user_email }}</span>
                    <a class="auth-link" href="{{ url_for('logout') }}">Sair</a>
                {% else %}
                    <a class="auth-link google-login" href="{{ url_for('login') }}">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon" />
                        Entrar com Google
                    </a>
                {% endif %}
                
                <div class="status">
                    <span id="statusText">Pronto.</span>
                    <span id="loadingSpinner" class="loading" style="display: none;"></span>
                </div>
            </div>
        </div>

        <div class="kanban-board">
            <div class="kanban-columns" id="kanbanColumns">
                <!-- As colunas serão geradas dinamicamente pelo JavaScript -->
            </div>
        </div>
    </div>

    <!-- Modal: Adicionar Novo Projeto -->
    <div id="projectModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Novo Projeto</h2>
                <button type="button" id="closeProjectModal" class="modal-close">×</button>
            </div>
            <div class="modal-body">
                <form id="project-form">
                    <button type="button" id="deip-button" class="deip-button">Selecionar DEIP (.pdf)...</button>
                    <input type="file" id="deip_pdf" name="deip_pdf" accept=".pdf" required hidden>
                    <span id="deip-filename" class="filename-display"></span>

                    <!-- Dados do Cliente -->
                    <fieldset>
                        <legend>Dados do Cliente</legend>
                        <div class="form-grid">
                            <label for="nome_cliente">Nome do Cliente:</label>
                            <input type="text" id="nome_cliente" name="nome_cliente" required>
                            
                            <label for="codigo_contrato">Código do Contrato (código/ano):</label>
                            <input type="text" id="codigo_contrato" name="codigo_contrato" required>
                            
                            <label for="cnpj">CNPJ (só números):</label>
                            <input type="text" id="cnpj" name="cnpj">
                            
                            <label for="cidade">Cidade:</label>
                            <input type="text" id="cidade" name="cidade">
                            
                            <label for="estado">Estado (UF):</label>
                            <input type="text" id="estado" name="estado">

                            <label for="concorrente">Concorrente:</label>
                            <input type="text" id="concorrente" name="concorrente" placeholder="Se aplicável">
                        </div>
                    </fieldset>

                    <!-- Configurações do Projeto -->
                    <fieldset>
                        <legend>Configurações do Projeto</legend>
                        <div class="form-grid">
                            <label>Data de Início:</label>
                            <div class="date-group">
                                <select id="day" name="day"></select>
                                <select id="month" name="month"></select>
                                <select id="year" name="year"></select>
                            </div>

                            <label for="servidor">Servidor:</label>
                            <select id="servidor" name="servidor">
                                <option>Local</option>
                                <option>Cloud Animati</option>
                                <option>Cloud Terceiros</option>
                            </select>

                            <label for="produto">Produtos Contratados:</label>
                            <select id="produto" name="produto">
                                <option>netRIS</option>
                                <option>AnimatiPACS</option>
                                <option>netRIS e AnimatiPACS</option>
                            </select>

                            <label for="gp_selecionado">Gerente de Projeto (GP):</label>
                            <select id="gp_selecionado" name="gp_selecionado">
                                <option>Giovani de Sousa</option>
                                <option>Willian dos Anjos</option>
                            </select>
                        </div>
                    </fieldset>

                    <!-- Detalhes do Escopo -->
                    <fieldset>
                        <legend>Detalhes do Escopo</legend>
                        <div class="radio-group">
                            <label>Haverá Importação?</label>
                            <div>
                                <input type="radio" id="import_sim" name="importacao" value="s"> <label for="import_sim">Sim</label>
                                <input type="radio" id="import_nao" name="importacao" value="n" checked> <label for="import_nao">Não</label>
                            </div>
                        </div>
                        <div id="importacao-options" class="checkbox-group hidden">
                            <input type="checkbox" id="import_cadastros" name="import_cadastros" value="1"><label for="import_cadastros">Cadastros</label>
                            <input type="checkbox" id="import_prontuarios" name="import_prontuarios" value="1"><label for="import_prontuarios">Prontuários</label>
                            <input type="checkbox" id="import_laudos" name="import_laudos" value="1"><label for="import_laudos">Laudos</label>
                            <input type="checkbox" id="import_imagens" name="import_imagens" value="1"><label for="import_imagens">Imagens</label>
                        </div>

                        <div class="radio-group">
                            <label>Haverá Integração?</label>
                            <div>
                                <input type="radio" id="integ_sim" name="integracao" value="s"> <label for="integ_sim">Sim</label>
                                <input type="radio" id="integ_nao" name="integracao" value="n" checked> <label for="integ_nao">Não</label>
                            </div>
                        </div>
                        <div id="integracao-options" class="hidden">
                            <input type="text" id="integracao_nome" name="integracao_nome" placeholder="Qual a ferramenta de integração?">
                            <div class="checkbox-group">
                                <input type="checkbox" id="integ_worklist" name="integ_worklist" value="1"><label for="integ_worklist">Worklist</label>
                                <input type="checkbox" id="integ_laudos" name="integ_laudos" value="1"><label for="integ_laudos">Retorno de Laudos</label>
                                <input type="checkbox" id="integ_docs" name="integ_docs" value="1"><label for="integ_docs">Documentos</label>
                                <input type="checkbox" id="integ_lab" name="integ_lab" value="1"><label for="integ_lab">Laboratório</label>
                                <input type="checkbox" id="integ_outros" name="integ_outros" value="1"><label for="integ_outros">Outros</label>
                            </div>
                        </div>
                    </fieldset>

                    <!-- Observações -->
                    <fieldset>
                        <legend>Observações</legend>
                        <textarea id="observacoes" name="observacoes" rows="4"></textarea>
                    </fieldset>

                    <button type="submit" id="start-button" class="submit-button">Iniciar Automação Completa</button>
                    <div id="status-label" class="status-label">Pronto para iniciar.</div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Sinaliza autenticação para o JS
        window.LOGGED_IN = {{ 'true' if logged_in else 'false' }};
    </script>
    <script src="{{ url_for('static', filename='js/script_registro.js') }}"></script>
    <script>
        // Configuração das colunas
        const COLUNAS = [
            { nome: "Aguardando Onboarding", class: "aguardando-onboarding" },
            { nome: "Falta Liberar Servidor Infra", class: "falta-liberar-servidor" },
            { nome: "Em andamento", class: "em-andamento" },
            { nome: "Em homologação", class: "em-homologacao" },
            { nome: "Em Virada", class: "em-virada" },
            { nome: "Em operação assistida", class: "em-operacao" },
            { nome: "Finalizado", class: "finalizado" },
            { nome: "Parado", class: "parado" },
            { nome: "Status Desconhecido", class: "status-desconhecido" }
        ];

        let projetosSalvos = {};
        let elementoSendoArrastado = null;

        // Inicializa as colunas do Kanban
        function inicializarKanban() {
            const kanbanColumns = document.getElementById('kanbanColumns');
            kanbanColumns.innerHTML = '';

            COLUNAS.forEach(coluna => {
                const colunaDiv = document.createElement('div');
                colunaDiv.className = `kanban-column ${coluna.class}`;
                colunaDiv.dataset.coluna = coluna.nome;

                colunaDiv.innerHTML = `
                    <div class="column-header ${coluna.class}">
                        ${coluna.nome}
                        <span class="column-count" id="count-${coluna.class}">0</span>
                    </div>
                    <div class="column-cards" id="cards-${coluna.class}">
                        <div class="empty-column">
                            Nenhum projeto nesta coluna
                        </div>
                    </div>
                `;

                // Adicionar eventos de drag and drop
                const cardsContainer = colunaDiv.querySelector('.column-cards');
                cardsContainer.addEventListener('dragover', handleDragOver);
                cardsContainer.addEventListener('drop', handleDrop);
                cardsContainer.addEventListener('dragenter', handleDragEnter);
                cardsContainer.addEventListener('dragleave', handleDragLeave);

                kanbanColumns.appendChild(colunaDiv);
            });
        }

        // Carrega os projetos via API
        async function carregarProjetos() {
            const gpSelect = document.getElementById('gpSelect');
            const loadButton = document.getElementById('loadButton');
            const statusText = document.getElementById('statusText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            const gpSelecionado = gpSelect.value;
            if (!gpSelecionado) {
                alert('Por favor, selecione um GP.');
                return;
            }

            // Atualizar UI
            loadButton.disabled = true;
            loadButton.textContent = 'Carregando...';
            statusText.textContent = 'Carregando projetos...';
            loadingSpinner.style.display = 'inline-block';

            // Limpar colunas
            limparTodasColunas();

            try {
                const response = await fetch('/api/carregar_projetos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ gp: gpSelecionado })
                });

                const data = await response.json();

                if (data.sucesso) {
                    projetosSalvos = data.projetos;
                    renderizarProjetos(data.projetos);
                    statusText.textContent = `${data.total} projetos carregados.`;
                } else {
                    throw new Error(data.erro || 'Erro desconhecido');
                }

            } catch (error) {
                console.error('Erro ao carregar projetos:', error);
                statusText.textContent = 'Erro ao carregar projetos!';
                statusText.style.color = '#e74c3c';
                setTimeout(() => {
                    statusText.style.color = '#2c3e50';
                }, 3000);
            } finally {
                // Restaurar UI
                loadButton.disabled = false;
                loadButton.textContent = 'Carregar Projetos';
                loadingSpinner.style.display = 'none';
            }
        }

        // Limpa todas as colunas
        function limparTodasColunas() {
            COLUNAS.forEach(coluna => {
                const cardsContainer = document.getElementById(`cards-${coluna.class}`);
                cardsContainer.innerHTML = '<div class="empty-column">Nenhum projeto nesta coluna</div>';
                document.getElementById(`count-${coluna.class}`).textContent = '0';
            });
        }

        // Renderiza os projetos nas colunas
        function renderizarProjetos(projetosPorStatus) {
            COLUNAS.forEach(coluna => {
                const projetos = projetosPorStatus[coluna.nome] || [];
                const cardsContainer = document.getElementById(`cards-${coluna.class}`);
                const countElement = document.getElementById(`count-${coluna.class}`);

                cardsContainer.innerHTML = '';
                countElement.textContent = projetos.length;

                if (projetos.length === 0) {
                    cardsContainer.innerHTML = '<div class="empty-column">Nenhum projeto nesta coluna</div>';
                } else {
                    projetos.forEach((projeto, index) => {
                        const cardElement = criarCardProjeto(projeto, coluna.nome);
                        cardsContainer.appendChild(cardElement);
                        
                        // Animação escalonada
                        setTimeout(() => {
                            cardElement.style.opacity = '1';
                            cardElement.style.transform = 'translateY(0)';
                        }, index * 50);
                    });
                }
            });
        }

        // Cria um card de projeto
        function criarCardProjeto(projeto, coluna) {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.draggable = true;
            card.dataset.projetoId = projeto.id;
            card.dataset.colunaOrigem = coluna;
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';

            // Truncar nome do projeto se muito longo
            const nomeExibido = projeto.nome.length > 50 ? 
                projeto.nome.substring(0, 50) + '...' : 
                projeto.nome;

            card.innerHTML = `
                <div class="project-name">📋 ${nomeExibido}</div>
                <div class="project-info">
                    <div class="project-detail">
                        <span class="icon">👤</span>
                        <span>${projeto.gp}</span>
                    </div>
                </div>
                <div class="project-footer">
                    <div class="project-date">📅 ${projeto.data_inicio_formatada}</div>
                    <div class="project-days">⏱️ ${projeto.dias_na_fase}</div>
                </div>
            `;

            // Eventos de drag and drop
            card.addEventListener('dragstart', handleDragStart);
            card.addEventListener('dragend', handleDragEnd);

            // Tooltip com nome completo
            if (projeto.nome.length > 50) {
                card.title = projeto.nome;
            }

            return card;
        }

        // Manipuladores de eventos de drag and drop
        function handleDragStart(e) {
            elementoSendoArrastado = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', e.target.outerHTML);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            // Remover highlight de todas as colunas
            document.querySelectorAll('.kanban-column').forEach(col => {
                col.classList.remove('drag-over');
            });
            elementoSendoArrastado = null;
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            const coluna = e.target.closest('.kanban-column');
            if (coluna && elementoSendoArrastado) {
                coluna.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const coluna = e.target.closest('.kanban-column');
            if (coluna && !coluna.contains(e.relatedTarget)) {
                coluna.classList.remove('drag-over');
            }
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            const colunaDestino = e.target.closest('.kanban-column');
            if (!colunaDestino || !elementoSendoArrastado) {
                return false;
            }

            const nomeColunaDest = colunaDestino.dataset.coluna;
            const nomeColumnaOrig = elementoSendoArrastado.dataset.colunaOrigem;

            if (nomeColunaDest === nomeColumnaOrig) {
                return false;
            }

            // Mover o card visualmente
            moverCardVisualmente(elementoSendoArrastado, nomeColumnaOrig, nomeColunaDest);

            // Remover highlight
            colunaDestino.classList.remove('drag-over');

            return false;
        }

        // Move o card visualmente entre colunas
        function moverCardVisualmente(cardElement, colunaOrigem, colunaDestino) {
            const projetoId = cardElement.dataset.projetoId;
            
            // Encontrar o projeto nos dados salvos
            let projetoEncontrado = null;
            for (const coluna in projetosSalvos) {
                const index = projetosSalvos[coluna].findIndex(p => p.id === projetoId);
                if (index !== -1) {
                    projetoEncontrado = projetosSalvos[coluna][index];
                    projetosSalvos[coluna].splice(index, 1);
                    break;
                }
            }

            if (!projetoEncontrado) {
                console.error('Projeto não encontrado nos dados salvos');
                return;
            }

            // Adicionar à nova coluna
            if (!projetosSalvos[colunaDestino]) {
                projetosSalvos[colunaDestino] = [];
            }
            projetoEncontrado.status_atual = colunaDestino;
            projetosSalvos[colunaDestino].push(projetoEncontrado);

            // Atualizar a interface
            renderizarProjetos(projetosSalvos);

            // Opcional: Enviar para o servidor
            enviarMovimentoParaServidor(projetoId, colunaOrigem, colunaDestino);

            console.log(`✅ Projeto movido de "${colunaOrigem}" para "${colunaDestino}"`);
        }

        // Envia a movimentação para o servidor (opcional)
        async function enviarMovimentoParaServidor(projetoId, colunaOrigem, colunaDestino) {
            try {
                const response = await fetch('/api/mover_projeto', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        projeto_id: projetoId,
                        coluna_origem: colunaOrigem,
                        coluna_destino: colunaDestino
                    })
                });

                const data = await response.json();
                if (!data.sucesso) {
                    console.warn('Aviso do servidor:', data.mensagem || 'Movimento não sincronizado');
                }
            } catch (error) {
                console.error('Erro ao sincronizar movimento:', error);
            }
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            inicializarKanban();
            
            // Adicionar evento Enter no select
            document.getElementById('gpSelect').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    carregarProjetos();
                }
            });
        });

        // Prevenir comportamento padrão de drop em toda a página
        document.addEventListener('dragover', function(e) {
            e.preventDefault();
        });

        document.addEventListener('drop', function(e) {
            e.preventDefault();
        });

        // === Lógica do Modal e do Formulário de Novo Projeto ===
        // Removida para evitar duplicidade; toda a lógica está em static/js/script_registro.js
    </script>
</body>
</html>
