<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard de Projetos</title>
    
    <!-- Preload da imagem de fundo para carregamento instantâneo -->
    <link rel="preload" as="image" href="{{ url_for('static', filename='images/plano-de-fundo.png') }}">
    
    <!-- CSS inline crítico para evitar flash de conteúdo não estilizado -->
    <style>
        body.login-page {
            background-image: url("{{ url_for('static', filename='images/plano-de-fundo.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
            height: 100vh;
            /* Cor de fallback enquanto a imagem carrega */
            background-color: #1a1a2e;
        }
    </style>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h1>Dashboard de Projetos</h1>
            <p>Faça login para continuar</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <div class="flash-messages">
                  {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <a class="auth-link google-login" href="{{ url_for('main.google_login') }}">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon" />
                Entrar com Google
            </a>
        </div>
    </div>
</body>
</html>
